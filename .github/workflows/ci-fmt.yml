---
name: Linting and Formatting
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'testing/**'
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'testing/**'
      - 'terraform/**'
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e1148
      - name: Setup Node.js
        uses: actions/setup-python@a0853c2
        with:
          node-version: '24'

      # TODO: Think about how we can only install the dependencies needed for linting, rather than the full dev dependencies
      - name: Install Dependencies
        run: make install-dev
      - name: Run ESLint
        run: make lint

  format-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e1148
      - name: Setup Node.js
        uses: actions/setup-python@a0853c2
        with:
          node-version: '24'
      - name: Install Prettier
        run: npm install prettier
      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a # Pin to latest version 3 of terraform
        with:
          terraform_version: '1.14.3'
      - name: Check code formatting with Prettier
        run: |
          cd frontend && npx prettier --check .
          cd ../backend && npx prettier --check .
          cd ../testing/ui && npx prettier --check .
          cd ../accessibility && npx prettier --check .
      - name: Check Terraform formatting
        run: |
          terraform fmt -check -recursive
