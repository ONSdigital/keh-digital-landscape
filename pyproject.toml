[project]
name = "keh-digital-landscape-docs"
version = "0.1.0"
description = "Documentation using MkDocs for the Digital Landscape."
authors = [
    {name = "ONSdigital/keh-dev"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.6,<10.0.0)",
    "mkdocstrings-python (>=2.0.3,<3.0.0)",
    "pymdown-extensions (>=10.21.3,<11.0.0)",
    "mkdocs-material-extensions (>=1.3.1,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
